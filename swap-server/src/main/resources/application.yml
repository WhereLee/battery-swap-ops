server:
  port: 8400
  servlet:
    context-path: /api
  # S3.8：优雅停机——停止接收新请求，等待在途请求/调度任务收尾（预算 30s）
  shutdown: graceful
  tomcat:
    # S3.8 WP4：Tomcat 线程 100（有界），与应用池(16)/DB 池(20) 形成递减基线
    threads:
      max: 100
      min-spare: 10
    accept-count: 100
    max-connections: 2000

spring:
  application:
    name: swap-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      # S3.8 WP4：多个 @Scheduled（对账/扫描/看护/补偿）共用调度池——单线程会互相阻塞
      pool:
        size: 4
      shutdown:
        # 定时任务（对账/扫描/中继）停机等待收尾，避免半执行
        await-termination: true
        await-termination-period: 20s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/swap_ops?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      # S3.8 WP4：连接池基线——拿不到连接 2s 快速失败（不无限排队），泄漏 20s 打点
      pool-name: swap-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1700000
      leak-detection-threshold: 20000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

resilience4j:
  # S3.8 WP3：设备下行护栏（程序化使用，配置驱动）
  circuitbreaker:
    instances:
      deviceDownlink:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
  bulkhead:
    instances:
      deviceDownlink:
        # 并发下行封顶（信号量）；拿不到许可 50ms 内快速失败，不排队拖线程
        max-concurrent-calls: 8
        max-wait-duration: 50ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

swap:
  device:
    sim-base-url: http://127.0.0.1:8500
    heartbeat-timeout-seconds: 60
    soc-full-threshold: 90
    connect-timeout-millis: 2000
    read-timeout-millis: 3000
    command-timeout-seconds: 60
    max-retry: 3
    reconcile-interval-ms: 15000
    reconcile-batch: 100
    mq:
      # 平台 MQ 消费（S3.5；HTTP 通道保留为降级）：并发度=1 保序
      enabled: true
      endpoint: 127.0.0.1:8081
      topic: swap-device-event
      consumer-group: platform-device-event
  admin:
    # 管理端静态 token：仅环境变量注入（仓库零明文）；未配置启动即失败
    token: ${SWAP_ADMIN_TOKEN:}
  billing:
    balance-fee-fen: 300
    deposit-fen: 9900
    overdue-hours: 24
    overdue-fee-per-hour-fen: 100
    preempt-ttl-seconds: 120
    pickup-timeout-seconds: 120
  pay:
    # 支付回调签名密钥：仅环境变量注入（仓库零明文）；未配置启动即失败
    secret: ${SWAP_PAY_SECRET:}
    mock-page-base-url: http://127.0.0.1:8400/api/pay/mock
    max-recharge-fen: 50000
    refund-compensation-interval-ms: 30000
  order:
    sweep-interval-ms: 5000
  delay:
    poll-interval-ms: 1000
    batch: 100
    max-attempts: 3
    backoff-base-millis: 5000
  job:
    lock-ttl-seconds: 60
  reconcile:
    # 日终对账（S3.5）
    cron: "0 0 2 * * ?"
    stale-margin-seconds: 3600
    window-hours: 24
    sample-limit: 200
  ratelimit:
    # S3.8 WP2 令牌桶限流（粒度由 @RateLimit 注解声明；关闭后注解失效）
    enabled: true
  cache:
    # S3.8 WP1 两级缓存：L1=Caffeine 本进程 / L2=Redis JSON；仅展示/字典类读
    enabled: true
    l1-ttl-seconds: 30
    l1-max-size: 10000
    l2-ttl-seconds: 300
    null-ttl-seconds: 30
    ttl-jitter-percent: 10
    rebuild-lock-seconds: 5
    rebuild-wait-millis: 200
    invalidate-channel: swap:cache:invalidate
  id:
    # Snowflake（S3.8）：workerId 走 Redis 租约；-1=自动申请（0~31 第一个空闲）
    datacenter-id: 1
    worker-id: -1
    worker-lease-seconds: 120
    worker-renew-interval-ms: 30000
    rollback-tolerance-millis: 5
  battery:
    # S4.1 电池健康：SOH 告警阈值/扫描间隔（联调可缩短）
    soh-warn-threshold: 80
    soh-good-threshold: 90
    soh-fair-threshold: 80
    scan-interval-ms: 3600000
  workorder:
    # S4.4 工单 SLA（分钟，按严重级；联调可缩短）
    sla-minutes-high: 30
    sla-minutes-medium: 120
    sla-minutes-low: 480
  outbox:
    # S3.8 WP6：本地消息表中继（重试上限刻意放宽：短时 MQ 抖动不进死信；真死信由 OUTBOX_DEAD 告警）
    relay-interval-ms: 5000
    batch: 50
    max-attempts: 20
    backoff-base-millis: 5000
  alarm:
    # 告警治理（S3.6）
    dedup-window-seconds: 300
    rate-limit-per-minute: 30
    batch-offline-threshold: 5
    offline-scan-interval-ms: 30000
    watchdog-interval-ms: 60000
    event-enabled: true
  dev:
    # 本地联调开关：默认关闭；运行参数 -Dspring-boot.run.arguments=--swap.dev.enabled=true 打开
    enabled: false
    # 设备密钥：仅环境变量注入（仓库零明文）
    secret: ${SWAP_DEV_SECRET:}
    cabinets: 10
    cells-per-cabinet: 12
    full-cells: 6

logging:
  level:
    com.swapops: info
