server:
  port: 8400
  servlet:
    context-path: /api
  # S3.8：优雅停机——停止接收新请求，等待在途请求/调度任务收尾（预算 30s）
  shutdown: graceful
  tomcat:
    # S3.8 WP4：Tomcat 线程 100（有界），与应用池(16)/DB 池(20) 形成递减基线
    threads:
      max: 100
      min-spare: 10
    accept-count: 100
    max-connections: 2000

spring:
  application:
    name: swap-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      # S3.8 WP4：多个 @Scheduled（对账/扫描/看护/补偿）共用调度池——单线程会互相阻塞
      pool:
        size: 4
      shutdown:
        # 定时任务（对账/扫描/中继）停机等待收尾，避免半执行
        await-termination: true
        await-termination-period: 20s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/swap_ops?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      # S3.8 WP4：连接池基线——拿不到连接 2s 快速失败（不无限排队），泄漏 20s 打点
      pool-name: swap-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1700000
      leak-detection-threshold: 20000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # P1-10 混沌发现：Redis 故障必须快速失败——默认 Lettuce command timeout 60s
      # 会把调度/请求线程池拖死（HTTP 层 CONN_REFUSED），故障面从"Redis 依赖功能"扩散为"全站瘫痪"
      connect-timeout: 1s
      timeout: 2s

resilience4j:
  # S3.8 WP3：设备下行护栏（程序化使用，配置驱动）
  circuitbreaker:
    instances:
      deviceDownlink:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
  bulkhead:
    instances:
      deviceDownlink:
        # 并发下行封顶（信号量）；拿不到许可 50ms 内快速失败，不排队拖线程
        max-concurrent-calls: 8
        max-wait-duration: 50ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  # P0-4：OpenAPI 文档（/api/swagger-ui.html、/api/v3/api-docs）；演示/复现用，只读展示
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

swap:
  device:
    sim-base-url: http://127.0.0.1:8500
    heartbeat-timeout-seconds: 60
    soc-full-threshold: 90
    connect-timeout-millis: 2000
    read-timeout-millis: 3000
    command-timeout-seconds: 60
    max-retry: 3
    reconcile-interval-ms: 15000
    reconcile-batch: 100
    mq:
      # 平台 MQ 消费（S3.5；HTTP 通道保留为降级）；P0-2 分片保序：
      # 发送端按 cabinetNo 设 FIFO message group（同柜同队列、柜内严格 FIFO 投递），
      # 消费端按柜 hash 到固定 worker——同柜串行、跨柜并行；
      # 保序不变量从"全局"降为"每柜"（序守卫本就按 (cabinetNo,bootId) 判定，业务语义不变）
      enabled: true
      endpoint: 127.0.0.1:8081
      topic: swap-device-event
      consumer-group: platform-device-event
      consumer-threads: 4      # 跨柜并行度（同柜恒串行）
      batch-size: 16           # 单次 receive 批量条数
      invisible-seconds: 30    # 处理窗口（含同柜排队余量；超时未 ack 由 broker 重投）
  admin:
    # 管理端静态 token：仅环境变量注入（仓库零明文）；未配置启动即失败
    token: ${SWAP_ADMIN_TOKEN:}
  billing:
    balance-fee-fen: 300
    deposit-fen: 9900
    overdue-hours: 24
    overdue-fee-per-hour-fen: 100
    preempt-ttl-seconds: 120
    pickup-timeout-seconds: 120
  pay:
    # 支付回调签名密钥：仅环境变量注入（仓库零明文）；未配置启动即失败
    secret: ${SWAP_PAY_SECRET:}
    mock-page-base-url: http://127.0.0.1:8400/api/pay/mock
    max-recharge-fen: 50000
    refund-compensation-interval-ms: 30000
  order:
    sweep-interval-ms: 5000
  delay:
    poll-interval-ms: 1000
    batch: 100
    max-attempts: 3
    backoff-base-millis: 5000
  job:
    lock-ttl-seconds: 60
  reconcile:
    # 日终对账（S3.5）
    cron: "0 0 2 * * ?"
    stale-margin-seconds: 3600
    window-hours: 24
    sample-limit: 200
  ratelimit:
    # S3.8 WP2 令牌桶限流（粒度由 @RateLimit 注解声明；关闭后注解失效）
    enabled: true
    # 批次33：受信反向代理（精确 IP 或 CIDR）。空=不采信任何 X-Forwarded-For，
    # IP 维度按 TCP 对端地址分桶。只有确实有反代（云上 nginx）时才配置，
    # 否则登录撞库防护的分桶键会落到客户端可伪造的 header 上（可一行绕过）。
    trusted-proxies: []
  cache:
    # S3.8 WP1 两级缓存：L1=Caffeine 本进程 / L2=Redis JSON；仅展示/字典类读
    enabled: true
    l1-ttl-seconds: 30
    l1-max-size: 10000
    l2-ttl-seconds: 300
    null-ttl-seconds: 30
    ttl-jitter-percent: 10
    rebuild-lock-seconds: 5
    rebuild-wait-millis: 200
    invalidate-channel: swap:cache:invalidate
  id:
    # Snowflake（S3.8）：workerId 走 Redis 租约；-1=自动申请（0~31 第一个空闲）
    datacenter-id: 1
    worker-id: -1
    worker-lease-seconds: 120
    worker-renew-interval-ms: 30000
    rollback-tolerance-millis: 5
  transfer:
    # S4.2 站间调拨规则（启发式）
    surplus-keep-level: 4
    deficit-target-level: 3
    max-per-task: 3
  battery:
    # S4.1 电池健康：SOH 告警阈值/扫描间隔（联调可缩短）
    soh-warn-threshold: 80
    soh-good-threshold: 90
    soh-fair-threshold: 80
    scan-interval-ms: 3600000
  workorder:
    # S4.4 工单 SLA（分钟，按严重级；联调可缩短）
    sla-minutes-high: 30
    sla-minutes-medium: 120
    sla-minutes-low: 480
  outbox:
    # S3.8 WP6：本地消息表中继（重试上限刻意放宽：短时 MQ 抖动不进死信；真死信由 OUTBOX_DEAD 告警）
    relay-interval-ms: 5000
    batch: 50
    max-attempts: 20
    backoff-base-millis: 5000
  alarm:
    # 告警治理（S3.6）
    dedup-window-seconds: 300
    rate-limit-per-minute: 30
    batch-offline-threshold: 5
    offline-scan-interval-ms: 30000
    watchdog-interval-ms: 60000
    event-enabled: true
    webhook:
      # P1-11：告警出站 webhook（url/secret 非空才启用；secret 经环境变量注入，仓库零明文）
      url: ${SWAP_ALARM_WEBHOOK_URL:}
      secret: ${SWAP_ALARM_WEBHOOK_SECRET:}
  dev:
    # 本地联调开关：默认关闭；运行参数 -Dspring-boot.run.arguments=--swap.dev.enabled=true 打开
    enabled: false
    # 设备密钥：仅环境变量注入（仓库零明文）
    secret: ${SWAP_DEV_SECRET:}
    cabinets: 10
    cells-per-cabinet: 12
    full-cells: 6

logging:
  level:
    com.swapops: info
  pattern:
    # P1-6：日志 pattern 引入 traceId 占位（此前 TraceIdFilter 写入 MDC 但默认 pattern 不落文本）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] --- [%15.15t] %-40.40logger{39} : %m%n"

management:
  # P1-6 可观测性：Prometheus 指标暴露（/api/actuator/prometheus，admin 静态 token 保护；health/info 公开）
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
