name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 四模块同父聚合：契约 + 平台 + 模拟器 + 运维 Agent（S6）；双端契约向量测试同 job 跑（改动即红）
      - name: Maven verify
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          for m in swap-contract swap-server swap-sim swap-agent; do
            if [ -f $m/target/site/jacoco/jacoco.csv ]; then
              awk -F, -v m=$m 'NR>1 {lm+=$8; lc+=$9} END {printf "%s LINE coverage: %.1f%% (%d/%d)\n", m, 100*lc/(lm+lc), lc, lm+lc}' $m/target/site/jacoco/jacoco.csv
            else
              echo "$m: jacoco.csv not found"
            fi
          done

  # S8 批次30：前端门禁。type-check 与 build 都是硬门禁——vue-tsc 失败即红。
  # 注意 build job 里的 PermissionCodeContractTest 会读 swap-web/src/api/permissions.ts，
  # 断言前端所用权限码 ⊆ AdminRole.ALL_CODES，故前后端权限码漂移会在 build job 变红。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swap-web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: swap-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc --noEmit)
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: swap-web-dist
          path: swap-web/dist
          retention-days: 7

  # batch37: verify the documented Docker/compose reproduction path end to end. The local dev
  # machine has no Docker, so this promise ("compose up gives you middleware, db/ migrations run
  # on first boot, the image runs against it") could only ever be checked here.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package jar (image input)
        run: mvn -B -ntp -DskipTests package

      - name: Compose middleware + build image + container smoke
        run: bash scripts/cloud/ci-container-smoke.sh

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs swap-ci 2>&1 | tail -60 || true
          docker compose -f docker-compose.middleware.yml logs 2>&1 | tail -30 || true
