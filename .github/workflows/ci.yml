name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 三模块同父聚合：契约 + 平台 + 模拟器；双端契约向量测试同 job 跑（改动即红）
      - name: Maven verify
        run: mvn -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          if [ -f swap-server/target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {lm+=$8; lc+=$9} END {printf "LINE coverage: %.1f%% (%d/%d)\n", 100*lc/(lm+lc), lc, lm+lc}' swap-server/target/site/jacoco/jacoco.csv
          else
            echo "jacoco.csv not found"
          fi
