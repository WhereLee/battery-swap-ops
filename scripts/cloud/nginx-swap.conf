# /etc/nginx/sites-available/swap-web
#
# battery-swap-ops admin console (S8 batch31).
#
# Why a reverse proxy at all: the console is a static SPA and the platform refuses to
# enable CORS (S8 plan 4.7). Serving dist/ and proxying /api from the same origin keeps
# the browser on one origin, so no CORS surface exists and the X-Admin-Token header
# travels over the same connection the page came from.
#
# Deploy: install to /etc/nginx/sites-available/swap-web, symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`. dist/ is published to /opt/swap/web.
# ufw is NOT opened by this file - public exposure stays a deliberate, separate decision.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/swap/web;
    index index.html;

    charset utf-8;
    client_max_body_size 4m;

    # SPA history mode: every unknown path is a client route (e.g. /work-orders/12),
    # so it must fall back to index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx trap: `add_header` is NOT additive across levels - a location that declares any
    # add_header discards every add_header inherited from the server block. Since /assets/
    # and = /index.html both set cache headers, the security headers below must be repeated
    # there (first cloud deploy proved it: the headers were silently missing).
    set $swap_security "1";

    # Vite emits content-hashed filenames, so they can be cached forever.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log off;
    }

    # index.html references the hashed assets: caching it would pin clients to a stale
    # bundle after a deploy. This is also the block that serves "/" via try_files fallback,
    # so it is the one a header probe on "/" actually hits.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8400/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the peer address to any client-supplied header, so the RIGHTMOST entry
        # is the only one nginx vouches for. The platform's rate limiter must read it that
        # way (leftmost is attacker-controlled); see document/pitfalls.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Security headers that cost nothing for an intranet console. Repeated inside the two
    # locations that declare their own add_header (see the trap note above).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
